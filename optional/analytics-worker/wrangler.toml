name = "xmz-research-analytics"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "xmz-analytics"
database_id = "52db45e8-ef0e-4583-9223-0545877b5974"

[vars]
# Keep the GitHub Pages origin. Add future custom domains without removing it.
ALLOWED_ORIGINS = "https://xmzhangai.github.io,http://127.0.0.1:4173,http://localhost:4321"
STORE_RAW_IP = "true"
RETENTION_DAYS = "90"

[triggers]
crons = ["17 3 * * *"]

# Secrets remain stored in Cloudflare and are never committed:
# IP_SALT
# ADMIN_USER
# ADMIN_PASSWORD
