<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset website cache</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07141e;color:#f1eee5;font:16px system-ui}.box{max-width:560px;padding:40px;border:1px solid #47606e}button{padding:12px 18px;background:#50d7c8;border:0;font-weight:700}</style></head>
<body><main class="box"><h1>Reset website cache</h1><p>Use this once if an earlier version of the site appears mixed with the new design.</p><button type="button" id="reset">Clear old cache and reload</button><p id="status" role="status"></p></main><script>document.getElementById('reset').onclick=async()=>{const s=document.getElementById('status');s.textContent='Clearing…';if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}s.textContent='Done. Returning to the homepage…';setTimeout(()=>location.href='/',600)}</script></body></html>
